[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application monopage : toute route retombe sur index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html ne doit jamais être servi depuis le cache :
# c'est lui qui référence les bundles JS/CSS versionnés.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les assets portent un hash dans leur nom : cache long sans risque.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
